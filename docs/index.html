<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WebPC — TinyEMU</title>
  <style>
    body { font-family: system-ui; margin:18px; }
    #controls { display:flex; gap:8px; margin-bottom:12px; }
    #progress { width:100%; height:14px; background:#eee; border-radius:6px; overflow:hidden; }
    #progress > i { display:block; height:100%; width:0%; background:#4caf50; transition:width .2s; }
    #status { margin-left:8px; }
    #log { white-space:pre-wrap; background:#111; color:#ddd; padding:10px; height:260px; overflow:auto; margin-top:12px; }
    canvas { width:100%; max-width:800px; background:#000; margin-top:12px; }
  </style>
</head>
<body>

<h1>WebPC — TinyEMU</h1>

<div id="controls">
  <button id="start-vm">Start VM</button>
  <button id="stop-vm" disabled>Stop VM</button>
  <div id="progress"><i></i></div>
  <div id="status">Idle</div>
</div>

<div id="log"></div>
<canvas id="screen" width="800" height="600"></canvas>

<!-- CRITICAL: define Module BEFORE loading tinyemu.js -->
<script>
  window.Module = {
    noInitialRun: true,          // prevents auto-run
    onRuntimeInitialized() {     // signals FS is ready
      console.log("TinyEMU runtime initialized");
      window._runtimeReady = true;
    }
  };
</script>

<!-- Load TinyEMU -->
<script src="wasm/tinyemu.js"></script>

<!-- App logic -->
<script src="app.js"></script>

</body>
</html>
