name: Build TinyEMU WASM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Emscripten SDK
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest
          echo "$PWD/upstream/emscripten" >> $GITHUB_PATH
          echo "$PWD" >> $GITHUB_PATH

      - name: Build tinyemu (emcc)
        env:
          EMCC_FORCE_STDLIBS: 1
        run: |
          source emsdk/emsdk_env.sh
          mkdir -p docs/wasm

          emcc wasm-vm/src/main.c \
            -O2 \
            -s WASM=1 \
            -s MODULARIZE=1 \
            -s EXPORT_NAME="TinyEmuModule" \
            -s ENVIRONMENT=web \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s EXPORTED_RUNTIME_METHODS='["ccall","cwrap","FS","getValue","setValue","stringToUTF8","UTF8ToString"]' \
            -s EXPORTED_FUNCTIONS='["_main","_get_framebuffer_ptr","_get_framebuffer_width","_get_framebuffer_height","_vm_key"]' \
            -o docs/wasm/tinyemu.js

          echo "=== produced files ==="
          ls -lh docs/wasm || true


      - name: Upload wasm JS artifact
        uses: actions/upload-artifact@v4
        with:
          name: tinyemu-js
          path: docs/wasm/tinyemu.js
          retention-days: 7

      - name: Upload wasm binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: tinyemu-wasm
          path: docs/wasm/tinyemu.wasm
          retention-days: 7

      - name: Disable Jekyll
        run: echo "" > docs/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
