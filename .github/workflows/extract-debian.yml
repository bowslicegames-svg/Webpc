name: Extract vmlinux from Google Drive disk.raw

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Download disk.raw from Google Drive
        run: |
          mkdir work
          cd work
          echo "Downloading disk.raw..."
          wget --no-check-certificate "https://drive.google.com/uc?export=download&id=1PzOalhxIo1ay_6AMarYVr7t6ZCO7PJF0" -O disk.raw

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils kpartx

      - name: Extract vmlinux
        run: |
          cd work
          sudo kpartx -av disk.raw
          ls /dev/mapper
          sudo mkdir mnt
          # Try first partition, fallback to second
          sudo mount /dev/mapper/loop0p1 mnt || sudo mount /dev/mapper/loop0p2 mnt
          cp mnt/boot/vmlinux* ./vmlinux
          sudo umount mnt
          sudo kpartx -dv disk.raw

      - name: Upload extracted kernel
        uses: actions/upload-artifact@v4
        with:
          name: debian-vmlinux
          path: work/vmlinux
