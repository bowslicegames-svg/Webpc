name: Import disk.raw from release ZIP

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  import-disk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Prepare workspace
        run: |
          mkdir -p work
          cd work
          pwd

      - name: Download release ZIP
        run: |
          cd work
          curl -L "https://github.com/bowslicegames-svg/Webpc/releases/download/Zip/disk.zip" -o disk.zip
          ls -lh disk.zip

      - name: Unzip release
        run: |
          cd work
          unzip -o disk.zip
          ls -lh

      - name: Find and move disk.raw into repo
        run: |
          # locate disk.raw inside extracted files
          FOUND=$(find work -type f -name "disk.raw" -print -quit)
          if [ -z "$FOUND" ]; then
            # also check current directory (in case unzip created files at top-level)
            FOUND=$(find . -type f -name "disk.raw" -print -quit)
          fi
          if [ -z "$FOUND" ]; then
            echo "ERROR: disk.raw not found in the ZIP archive"
            ls -R
            exit 1
          fi
          mkdir -p docs/wasm
          mv "$FOUND" docs/wasm/disk.raw
          ls -lh docs/wasm

      - name: Commit disk.raw to repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/wasm/disk.raw
          git commit -m "Add disk.raw extracted from release ZIP" || echo "No changes to commit"
          git push
