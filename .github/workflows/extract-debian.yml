name: Extract vmlinux from Google Drive disk.raw

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Download disk.raw from Google Drive (robust large-file method)
        run: |
          mkdir work
          cd work

          FILE_ID="1PzOalhxIo1ay_6AMarYVr7t6ZCO7PJF0"

          echo "Step 1: Requesting initial page..."
          curl -c cookies.txt -s -L \
            "https://drive.google.com/uc?export=download&id=${FILE_ID}" \
            -o initial.html

          echo "Step 2: Extracting confirm token..."
          CONFIRM=$(sed -rn 's/.*confirm=([0-9A-Za-z_]+).*/\1/p' initial.html)

          echo "Confirm token: ${CONFIRM}"

          echo "Step 3: Downloading actual disk.raw..."
          curl -Lb cookies.txt -s -L \
            "https://drive.google.com/uc?export=download&confirm=${CONFIRM}&id=${FILE_ID}" \
            -o disk.raw

          echo "Downloaded file:"
          ls -lh disk.raw

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils kpartx

      - name: Extract vmlinux
        run: |
          cd work
          echo "Mapping partitions..."
          sudo kpartx -av disk.raw

          echo "Checking mapper devices..."
          ls /dev/mapper

          echo "Mounting partition..."
          sudo mkdir mnt
          sudo mount /dev/mapper/loop0p1 mnt || sudo mount /dev/mapper/loop0p2 mnt

          echo "Copying vmlinux..."
          cp mnt/boot/vmlinux* ./vmlinux

          echo "Unmounting..."
          sudo umount mnt
          sudo kpartx -dv disk.raw

      - name: Upload extracted kernel
        uses: actions/upload-artifact@v4
        with:
          name: debian-vmlinux
          path: work/vmlinux
