name: Split disk.raw from ZIP and save parts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split-disk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Prepare workspace
        run: mkdir -p work

      - name: Download release ZIP
        run: |
          cd work
          curl -L "https://github.com/bowslicegames-svg/Webpc/releases/download/Zip/disk.zip" -o disk.zip

      - name: Unzip and copy disk.raw
        run: |
          cd work
          unzip -o disk.zip
          FOUND=$(find . -type f -name "disk.raw" -print -quit)
          if [ -z "$FOUND" ]; then
            echo "ERROR: disk.raw not found"
            exit 1
          fi
          echo "Found disk.raw at: $FOUND"
          cp "$FOUND" ./disk.raw   # <-- SAFE COPY, never errors
          ls -lh disk.raw

      - name: Split disk.raw into 100MB parts
        run: |
          cd work
          rm -f disk.raw.part*
          split -b 100M --numeric-suffixes=0 --suffix-length=2 disk.raw disk.raw.part
          ls -lh disk.raw.part*

      - name: Commit parts into repo
        run: |
          mkdir -p docs/wasm/parts
          git rm -f docs/wasm/parts/disk.raw.part* || true
          mv work/disk.raw.part* docs/wasm/parts/

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/wasm/parts/disk.raw.part*
          git commit -m "Add disk.raw split parts"
          git push
