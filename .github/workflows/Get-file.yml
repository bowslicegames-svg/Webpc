name: Split disk.raw from ZIP and save parts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split-disk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Prepare workspace
        run: |
          mkdir -p work

      - name: Split disk.raw into 100MB parts
        run: |
          cd work
          rm -f disk.raw.part*
          split -b 100M --numeric-suffixes=0 --suffix-length=2 disk.raw disk.raw.part
          ls -lh disk.raw.part*

      - name: Commit parts into repo
        run: |
          mkdir -p docs/wasm/parts

          # Remove old parts
          git rm -f docs/wasm/parts/disk.raw.part* || true

          # Move new parts
          mv work/disk.raw.part* docs/wasm/parts/

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/wasm/parts/disk.raw.part*
          git commit -m "Add disk.raw split parts"
          git push
