name: Extract vmlinux from zipped disk.raw

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare workspace
        run: |
          mkdir -p work
          cd work

      - name: Download disk.zip from GitHub Releases
        run: |
          cd work
          curl -L \
            "https://github.com/bowslicegames-svg/Webpc/releases/download/Zip/disk.zip" \
            -o disk.zip
          ls -lh disk.zip

      - name: Unzip disk.zip
        run: |
          cd work
          unzip -o disk.zip
          ls -lh

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils kpartx unzip

      - name: Extract vmlinux
        run: |
          cd work

          # Find disk.raw if not at top level
          if [ ! -f disk.raw ]; then
            FOUND=$(find . -type f -name "disk.raw" -print -quit)
            if [ -n "$FOUND" ]; then
              mv "$FOUND" disk.raw
            else
              echo "disk.raw not found"
              ls -R
              exit 1
            fi
          fi

          sudo kpartx -av disk.raw
          sleep 1

          sudo mkdir -p mnt
          sudo mount /dev/mapper/loop0p1 mnt || sudo mount /dev/mapper/loop0p2 mnt

          cp mnt/boot/vmlinux* ./vmlinux

          sudo umount mnt
          sudo kpartx -dv disk.raw

      - name: Upload extracted kernel
        uses: actions/upload-artifact@v4
        with:
          name: debian-vmlinux
          path: work/vmlinux
