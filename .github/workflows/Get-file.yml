name: Save disk.raw parts into repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split-and-save:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (with write credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Prepare workspace
        run: |
          set -euo pipefail
          mkdir -p work
          cd work
          pwd

      - name: Download release ZIP
        run: |
          set -euo pipefail
          cd work
          # Replace URL if different
          curl -L "https://github.com/bowslicegames-svg/Webpc/releases/download/Zip/disk.zip" -o disk.zip
          ls -lh disk.zip

      - name: Unzip and locate disk.raw
        run: |
          set -euo pipefail
          cd work
          unzip -o disk.zip
          FOUND=$(find . -type f -name "disk.raw" -print -quit)
          if [ -z "$FOUND" ]; then
            echo "ERROR: disk.raw not found in ZIP"
            ls -R
            exit 1
          fi
          echo "Found disk.raw at: $FOUND"
          mv "$FOUND" disk.raw
          ls -lh disk.raw

      - name: Split disk.raw into 100MB parts
        run: |
          set -euo pipefail
          cd work
          rm -f disk.raw.part*
          # split into 100MB parts with numeric suffixes starting at 00
          split -b 100M --numeric-suffixes=0 --suffix-length=2 disk.raw disk.raw.part
          ls -lh disk.raw.part*

      - name: Move parts into docs/wasm/parts and commit
        env:
          GIT_AUTHOR_NAME: "github-actions"
          GIT_AUTHOR_EMAIL: "github-actions@github.com"
        run: |
          set -euo pipefail
          # ensure target directory exists in repo
          mkdir -p docs/wasm/parts

          # remove any existing parts in repo to avoid duplicates
          git rm -f docs/wasm/parts/disk.raw.part* || true

          # move new parts into repo path
          mv work/disk.raw.part* docs/wasm/parts/

          # show what will be committed
          ls -lh docs/wasm/parts || true

          # commit and push
          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"
          git add docs/wasm/parts/disk.raw.part* || true
          git commit -m "Add disk.raw split parts (generated by workflow $GITHUB_RUN_ID)" || echo "No changes to commit"
          git push
