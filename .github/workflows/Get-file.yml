name: Split existing disk.raw into repo parts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (with write credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Prepare workspace
        run: |
          set -euo pipefail
          mkdir -p work
          cd work
          pwd

      - name: Locate disk.raw in repository
        id: find_disk
        run: |
          set -euo pipefail
          # Search from repo root for the first disk.raw
          FOUND=$(git ls-files -z | xargs -0 -n1 -I{} bash -c 'if [ "$(basename "{}")" = "disk.raw" ]; then echo "{}"; exit 0; fi' || true)
          if [ -z "$FOUND" ]; then
            # fallback to find in filesystem (in case file is untracked)
            FOUND=$(find . -type f -name "disk.raw" -print -quit || true)
          fi
          if [ -z "$FOUND" ]; then
            echo "disk_not_found=true" >> $GITHUB_OUTPUT
            echo "No disk.raw found in repository."
            exit 0
          fi
          echo "disk_not_found=false" >> $GITHUB_OUTPUT
          echo "disk_path=$FOUND" >> $GITHUB_OUTPUT
          echo "Found disk.raw at: $FOUND"

      - name: Copy disk.raw into workspace
        if: steps.find_disk.outputs.disk_not_found == 'false'
        run: |
          set -euo pipefail
          cd work
          # copy the located disk.raw into the workspace to avoid mv same-file errors
          SRC="${{ steps.find_disk.outputs.disk_path }}"
          echo "Copying $SRC to work/disk.raw"
          cp --reflink=auto --preserve=mode,timestamps "$SRC" disk.raw || cp "$SRC" disk.raw
          ls -lh disk.raw

      - name: Split disk.raw into 100MB parts
        if: steps.find_disk.outputs.disk_not_found == 'false'
        run: |
          set -euo pipefail
          cd work
          rm -f disk.raw.part*
          # split into 100MB parts with numeric suffixes starting at 00
          split -b 100M --numeric-suffixes=0 --suffix-length=2 disk.raw disk.raw.part
          ls -lh disk.raw.part*

      - name: Move parts into docs/wasm/parts and commit
        if: steps.find_disk.outputs.disk_not_found == 'false'
        env:
          GIT_AUTHOR_NAME: "github-actions"
          GIT_AUTHOR_EMAIL: "github-actions@github.com"
        run: |
          set -euo pipefail
          # ensure target directory exists in repo
          mkdir -p docs/wasm/parts

          # remove any existing parts in repo to avoid duplicates
          git rm -f docs/wasm/parts/disk.raw.part* || true

          # move new parts into repo path
          mv work/disk.raw.part* docs/wasm/parts/

          # show what will be committed
          ls -lh docs/wasm/parts || true

          # commit and push
          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"
          git add docs/wasm/parts/disk.raw.part* || true
          git commit -m "Add disk.raw split parts (generated by workflow $GITHUB_RUN_ID)" || echo "No changes to commit"
          git push

      - name: No disk found notice
        if: steps.find_disk.outputs.disk_not_found == 'true'
        run: |
          echo "No disk.raw found in the repository. Place disk.raw in the repo and re-run this workflow."
